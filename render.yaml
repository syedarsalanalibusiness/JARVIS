services:
  - type: web
    name: jarvis-voice-agent
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_LIVE_MODEL
        value: gemini-2.5-flash-native-audio-preview-12-2025
      - key: GEMINI_TEXT_MODEL
        value: gemini-3.1-flash-lite
      - key: OLLAMA_ENABLED
        value: "false"
